<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOAT das Promoções — Painel</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.webp?v=7" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <!-- Escondido até a sessão ser validada, para não piscar conteúdo antes do redirecionamento. -->
  <main class="solo" id="panel" hidden>
    <img class="solo__logo" src="assets/logo.webp?v=8" alt="GOAT das Promoções" width="132" height="132">
    <h1>Painel</h1>
    <p class="lead">Você está conectado como <strong id="user-email"></strong>.</p>
    <p class="lead">Aqui vai o conteúdo do painel.</p>
    <button class="btn-login solo__out" type="button" id="logout">Sair</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=8"></script>
  <script src="auth.js?v=8"></script>
  <script>
    (function () {
      var client = window.GDP_AUTH.client;
      var panel = document.getElementById("panel");

      function toLogin() { window.location.replace("index.html"); }

      client.auth.getSession().then(function (res) {
        var session = res.data && res.data.session;
        if (!session) return toLogin();
        document.getElementById("user-email").textContent = session.user.email;
        panel.hidden = false;
      }).catch(toLogin);

      // Sessão encerrada em outra aba ou expirada.
      client.auth.onAuthStateChange(function (event) {
        if (event === "SIGNED_OUT") toLogin();
      });

      document.getElementById("logout").addEventListener("click", function () {
        client.auth.signOut().then(toLogin, toLogin);
      });
    })();
  </script>
</body>
</html>
